# Built-in defaults, shown for reference. init writes the absolute path
# (e.g. /Users/<name>/Downloads/dmon) and creates the directory.
watch: ~/Downloads/dmon
archive_dir: ""
scan_interval: 2s
inactive: 3s
include: '\.csv$|\.jpg$|\.mp4$'
exclude: '\.tmp$|\.part$'
queue:
  max_inflight: 1
  retry_delay: 30s
  max_attempts: 5
